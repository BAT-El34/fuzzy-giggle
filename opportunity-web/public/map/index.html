<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6b57"><meta name="description" content="Map Search server-first : rayon, catégories, scoring, favoris, historique et exports."><link rel="manifest" href="/map/manifest.webmanifest"><link rel="icon" href="/map/icons/icon.svg"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"><link rel="stylesheet" href="/map/styles.css"><title>DraftWA Map Search</title></head><body>
<header class="topbar"><div class="brand"><div class="logo">M</div><div><b>Map Search</b><span>DraftWA Web</span></div></div><div class="topActions"><button id="installBtn" class="ghost hidden">Installer l’app</button><button id="historyBtn" class="ghost">Historique</button><a class="ghost linkBtn" href="/">DraftWA Mobile</a></div></header>
<main><section class="searchPanel"><div class="sectionTitle"><div><h1>Trouver ce qui compte autour d’un point</h1><p>La recherche, le scoring et l’export sont calculés côté serveur.</p></div><span id="backend" class="status">Backend…</span></div>
<div class="searchBox"><div class="locationRow"><input id="place" placeholder="Ville, quartier, adresse…" value="Hof, Bayern, Deutschland"><button id="locateBtn">Localiser</button><button id="meBtn" title="Ma position">◎</button></div><div id="suggestions" class="suggestions hidden"></div></div>
<div class="grid2"><label>Rayon <strong id="radiusText">3,0 km</strong><input id="radius" type="range" min="500" max="25000" step="500" value="3000"></label><label>Score minimum<select id="minScore"><option value="0">Tous</option><option value="40">40+</option><option value="55" selected>55+ (B)</option><option value="70">70+ (A)</option><option value="85">85+ (A+)</option></select></label></div>
<div><div class="fieldLabel">Catégories</div><div id="categories" class="chips"><button data-cat="company" class="on">Entreprises</button><button data-cat="tech" class="on">Tech</button><button data-cat="industry" class="on">Industrie</button><button data-cat="finance" class="on">Finance</button><button data-cat="public" class="on">Public</button><button data-cat="health" class="on">Santé</button><button data-cat="education" class="on">Éducation</button><button data-cat="retail">Commerces</button><button data-cat="hospitality">Hôtels</button></div></div>
<label>Mots-clés prioritaires<textarea id="keywords" placeholder="Software, Praktikum, Bank…">Software
IT
Engineering
Praktikum</textarea></label>
<div class="options"><label><input id="google" type="checkbox"> Google Places</label><label><input id="fit" type="checkbox" checked> Ajuster la carte</label></div>
<button id="searchBtn" class="primary">Rechercher</button><div class="progress"><div><span id="progressBar"></span></div><small id="progressText">Prêt.</small></div>
</section>
<section class="workspace"><div class="mapWrap"><div id="map"></div><div class="mapTools"><button id="mapMode" class="active">Carte</button><button id="listMode">Liste</button></div></div><div class="resultsPane"><div class="resultsHead"><div><b id="resultTitle">Résultats</b><span id="summary">Aucune recherche</span></div><div class="resultActions"><button id="saveSearch">☆ Enregistrer</button><button id="shareBtn">Partager</button><button id="exportBtn">Exporter</button></div></div><div class="filters"><input id="filter" placeholder="Filtrer les résultats"><select id="priority"><option value="">Toutes priorités</option><option>A+</option><option>A</option><option>B</option><option>C</option><option>D</option></select><select id="sort"><option value="score">Score</option><option value="distance">Distance</option><option value="name">Nom</option></select></div><div id="cards" class="cards"><div class="empty">Lance une recherche pour afficher les résultats.</div></div></div></section></main>
<div id="drawer" class="drawer hidden"><div class="drawerCard"><div class="drawerHead"><b>Historique & favoris</b><button id="closeDrawer">×</button></div><div id="drawerContent"></div></div></div>
<div id="exportModal" class="modal hidden"><div class="modalCard"><div class="drawerHead"><b>Exporter les résultats filtrés</b><button class="closeModal">×</button></div><div class="exportGrid"><button data-format="csv">CSV</button><button data-format="excel">Excel</button><button data-format="json">JSON</button><button data-format="geojson">GeoJSON</button></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script><script src="/map/app.js" defer></script></body></html>
