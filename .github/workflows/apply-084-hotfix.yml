name: Apply DraftWA 0.8.4 hotfix

on:
  push:
    branches:
      - draftwa-0.8.4-fix-tab-scroll
    paths:
      - tools/apply_084_hotfix.py
      - .github/workflows/apply-084-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: draftwa-0.8.4-fix-tab-scroll
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python3 tools/apply_084_hotfix.py

      - name: Run static release review
        run: python3 tools/static_review.py

      - name: Remove one-shot applicator
        run: |
          git rm tools/apply_084_hotfix.py
          git rm .github/workflows/apply-084-hotfix.yml

      - name: Commit patched 0.8.4 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/draftwa/mobile/DraftAccessibilityService.java fakewa/src/main/java/com/whatsapp/w4b/MainActivity.java tools/ci_android_journey.sh tools/static_review.py
          git commit -m "DraftWA 0.8.4: prevent tab-switch scrolls"
          git push origin HEAD:draftwa-0.8.4-fix-tab-scroll
