name: Apply DraftWA 0.8.3 Scroll Fix V2

on:
  push:
    branches:
      - draftwa-0.8.3-fix-scroll
    paths:
      - '.github/patch-083-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draftwa-0.8.3-fix-scroll
      - name: Apply exact guarded patch
        run: python3 tools/apply_scroll_fix_v2.py
      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/draftwa/mobile/DraftAccessibilityService.java
          git diff --cached --quiet && exit 1
          git commit -m 'Refine real-device draft scroll proof'
          git push origin HEAD:draftwa-0.8.3-fix-scroll
