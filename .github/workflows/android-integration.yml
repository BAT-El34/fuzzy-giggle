# Canonical preproduction release gate.
name: DraftWA Android Release Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - preproduction
    paths:
      - 'app/**'
      - 'fakewa/**'
      - 'tools/**'
      - 'opportunity-web/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-integration.yml'
  pull_request:
    branches:
      - preproduction
    paths:
      - 'app/**'
      - 'fakewa/**'
      - 'tools/**'
      - 'opportunity-web/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-integration.yml'

permissions:
  contents: read
  statuses: write

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static, model and backend validation
        run: |
          set -euxo pipefail
          python3 tools/static_review.py
          python3 tools/engine_model_test.py
          mkdir -p build/rules
          javac -d build/rules app/src/main/java/com/draftwa/mobile/MessageRules.java tools/RuleSimulation.java
          java -cp build/rules com.draftwa.mobile.RuleSimulation
          if [ -d opportunity-web ]; then
            node --check opportunity-web/lib/opportunity.js
            node --check opportunity-web/lib/server.js
            node --check opportunity-web/api/opportunities/health.js
            node --check opportunity-web/api/opportunities/geocode.js
            node --check opportunity-web/api/opportunities/search.js
            node --check opportunity-web/api/opportunities/export.js
            node --check opportunity-web/public/opportunities/app.js
            node opportunity-web/tests/run-tests.js
          fi

  android-integration:
    needs: rules
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Publish run link
        env:
          GH_TOKEN: ${{ github.token }}
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --retry 3 --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${RUN_URL}\",\"description\":\"DraftWA API ${API_LEVEL} diagnostic running\",\"context\":\"draftwa/api-${API_LEVEL}\"}"

      - name: Build DraftWA and fake WhatsApp Business
        run: gradle --no-daemon :app:assembleDebug :fakewa:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator diagnostic journey
        uses: ReactiveCircus/android-emulator-runner@v2.34.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: bash tools/ci_android_journey.sh ${{ matrix.api-level }}

      - name: Publish matrix result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          API_LEVEL: ${{ matrix.api-level }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --retry 3 --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"target_url\":\"${RUN_URL}\",\"description\":\"DraftWA API ${API_LEVEL}: ${JOB_STATUS}\",\"context\":\"draftwa/api-${API_LEVEL}\"}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draftwa-api-${{ matrix.api-level }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            fakewa/build/outputs/apk/debug/fakewa-debug.apk
            artifacts/**
          if-no-files-found: warn
          retention-days: 7

  release-candidate:
    needs: android-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Re-run non-Android validation
        run: |
          set -euxo pipefail
          python3 tools/static_review.py
          python3 tools/engine_model_test.py
          mkdir -p build/rules
          javac -d build/rules app/src/main/java/com/draftwa/mobile/MessageRules.java tools/RuleSimulation.java
          java -cp build/rules com.draftwa.mobile.RuleSimulation
          if [ -d opportunity-web ]; then node opportunity-web/tests/run-tests.js; fi

      - name: Build exact unsigned release candidate
        run: gradle --no-daemon :app:assembleRelease

      - name: Package Android release signing toolchain
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "${BUILD_TOOLS}/apksigner"
          test -x "${BUILD_TOOLS}/zipalign"
          test -f "${BUILD_TOOLS}/lib/apksigner.jar"
          mkdir -p release-tools/lib release-tools/lib64
          cp "${BUILD_TOOLS}/apksigner" release-tools/
          cp "${BUILD_TOOLS}/zipalign" release-tools/
          cp "${BUILD_TOOLS}/lib/apksigner.jar" release-tools/lib/
          if [ -d "${BUILD_TOOLS}/lib64" ]; then cp -a "${BUILD_TOOLS}/lib64/." release-tools/lib64/; fi
          chmod +x release-tools/apksigner release-tools/zipalign
          printf '%s\n' "${BUILD_TOOLS}" > release-tools/source.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DraftWA-unsigned-release-candidate
          path: |
            app/build/outputs/apk/release/*.apk
            release-tools/**
          if-no-files-found: error
          retention-days: 7
