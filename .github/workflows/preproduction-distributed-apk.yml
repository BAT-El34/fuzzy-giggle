name: DraftWA preproduction distributed APK startup

on:
  push:
    branches:
      - preproduction
    paths:
      - .github/workflows/preproduction-distributed-apk.yml
      - scripts/test_distributed_apk.sh
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  distributed-startup:
    name: Current distributed APK / Android API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34, 35]

    steps:
      - name: Checkout preproduction
        uses: actions/checkout@v4

      - name: Publish pending status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --retry 3 --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${RUN_URL}\",\"description\":\"Exact distributed APK startup on Android API ${API_LEVEL}\",\"context\":\"draftwa/distributed-api-${API_LEVEL}\"}"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and launch exact distributed APK
        id: launch
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2.34.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: API_LEVEL=${{ matrix.api-level }} bash scripts/test_distributed_apk.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draftwa-distributed-api-${{ matrix.api-level }}
          path: artifacts/distributed-api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 7

      - name: Publish final status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_LEVEL: ${{ matrix.api-level }}
          OUTCOME: ${{ steps.launch.outcome }}
        run: |
          if [[ "$OUTCOME" == "success" ]]; then
            STATE="success"
            DESCRIPTION="Distributed APK starts on Android API ${API_LEVEL}"
          else
            STATE="failure"
            DESCRIPTION="Distributed APK startup fails on Android API ${API_LEVEL}"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --retry 3 --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"target_url\":\"${RUN_URL}\",\"description\":\"${DESCRIPTION}\",\"context\":\"draftwa/distributed-api-${API_LEVEL}\"}"

      - name: Fail when startup test failed
        if: always() && steps.launch.outcome != 'success'
        run: exit 1
