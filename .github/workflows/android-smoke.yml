name: DraftWA Android smoke test

on:
  push:
    branches:
      - draftwa-testbed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Android API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34, 35]

    steps:
      - name: Checkout testbed
        uses: actions/checkout@v7

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android emulator and smoke-test DraftWA
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: API_LEVEL=${{ matrix.api-level }} bash scripts/smoke_test.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: draftwa-diagnostics-api-${{ matrix.api-level }}
          path: artifacts/api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 7
