name: DraftWA Android smoke test

on:
  push:
    branches:
      - draftwa-testbed
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke-test:
    name: Android API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34, 35]

    steps:
      - name: Checkout testbed
        uses: actions/checkout@v7

      - name: Publish pending status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --retry 3 --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${RUN_URL}\",\"description\":\"Android API ${API_LEVEL} smoke test running\",\"context\":\"draftwa/android-${API_LEVEL}\"}"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android emulator and smoke-test DraftWA
        id: smoke
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: API_LEVEL=${{ matrix.api-level }} bash scripts/smoke_test.sh

      - name: Publish final status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_LEVEL: ${{ matrix.api-level }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [[ "$SMOKE_OUTCOME" == "success" ]]; then
            STATE="success"
            DESCRIPTION="Android API ${API_LEVEL}: DraftWA startup PASS"
          else
            STATE="failure"
            DESCRIPTION="Android API ${API_LEVEL}: DraftWA startup FAIL"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --retry 3 --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"target_url\":\"${RUN_URL}\",\"description\":\"${DESCRIPTION}\",\"context\":\"draftwa/android-${API_LEVEL}\"}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: draftwa-diagnostics-api-${{ matrix.api-level }}
          path: artifacts/api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 7

      - name: Fail job when smoke test failed
        if: always() && steps.smoke.outcome != 'success'
        run: exit 1
