name: One-shot DraftWA 0.8.5 overlay patch

on:
  push:
    branches: [draftwa-0.8.5-overlay]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply DraftWA 0.8.5 overlay patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draftwa-0.8.5-overlay
      - name: Apply overlay implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          root = Path('.')

          overlay = r'''package com.draftwa.mobile;

import android.content.Context;
import android.content.SharedPreferences;
import android.graphics.Color;
import android.graphics.PixelFormat;
import android.graphics.drawable.GradientDrawable;
import android.os.Handler;
import android.os.Looper;
import android.view.Gravity;
import android.view.MotionEvent;
import android.view.View;
import android.view.WindowManager;
import android.widget.TextView;

import java.util.Locale;

final class DraftOverlayController {
    private final Context context;
    private final Runnable toggleAction;
    private final Handler handler = new Handler(Looper.getMainLooper());
    private final SharedPreferences prefs;
    private WindowManager windowManager;
    private TextView bubble;
    private TextView timer;
    private WindowManager.LayoutParams bubbleParams;
    private boolean shown;

    private final SharedPreferences.OnSharedPreferenceChangeListener listener = (sp, key) -> {
        if (Prefs.RUNNING.equals(key) || Prefs.PAUSED.equals(key) || Prefs.NEXT_ACTION_AT.equals(key)) {
            refreshNow();
        }
    };

    private final Runnable clock = new Runnable() {
        @Override public void run() {
            refreshNow();
            if (shown) handler.postDelayed(this, 500L);
        }
    };

    DraftOverlayController(Context context, Runnable toggleAction) {
        this.context = context;
        this.toggleAction = toggleAction;
        this.prefs = Prefs.p(context);
    }

    void show() {
        if (shown) return;
        try {
            windowManager = (WindowManager) context.getSystemService(Context.WINDOW_SERVICE);
            if (windowManager == null) throw new IllegalStateException("WindowManager unavailable");

            bubble = new TextView(context);
            bubble.setGravity(Gravity.CENTER);
            bubble.setTextSize(20f);
            bubble.setTextColor(Color.rgb(38, 50, 56));
            bubble.setBackground(roundRect(Color.WHITE, 24, Color.rgb(226, 232, 235), 1));
            bubble.setElevation(dp(5));
            bubble.setAlpha(0.94f);
            bubble.setOnTouchListener(new BubbleTouch());

            int defaultX = Math.max(dp(12), context.getResources().getDisplayMetrics().widthPixels - dp(62));
            int defaultY = dp(180);
            int x = prefs.getInt(Prefs.OVERLAY_X, defaultX);
            int y = prefs.getInt(Prefs.OVERLAY_Y, defaultY);
            bubbleParams = new WindowManager.LayoutParams(
                    dp(46), dp(46),
                    WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                            | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                    PixelFormat.TRANSLUCENT);
            bubbleParams.gravity = Gravity.TOP | Gravity.START;
            bubbleParams.x = clampX(x);
            bubbleParams.y = clampY(y);

            timer = new TextView(context);
            timer.setGravity(Gravity.CENTER);
            timer.setTextSize(12f);
            timer.setTextColor(Color.rgb(55, 65, 71));
            timer.setPadding(dp(13), dp(7), dp(13), dp(7));
            timer.setBackground(roundRect(Color.WHITE, 18, Color.rgb(231, 235, 237), 1));
            timer.setElevation(dp(4));
            timer.setAlpha(0.96f);
            WindowManager.LayoutParams timerParams = new WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                            | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                            | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                    PixelFormat.TRANSLUCENT);
            timerParams.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
            timerParams.y = dp(20);

            windowManager.addView(bubble, bubbleParams);
            windowManager.addView(timer, timerParams);
            shown = true;
            prefs.registerOnSharedPreferenceChangeListener(listener);
            refreshNow();
            handler.post(clock);
            DiagnosticLog.event(context, "OVERLAY_SHOWN", "accessibility-overlay");
        } catch (Throwable t) {
            DiagnosticLog.event(context, "OVERLAY_SHOW_FAILED", t.getClass().getSimpleName());
            destroy();
        }
    }

    void refreshNow() {
        if (!shown || bubble == null || timer == null) return;
        boolean running = prefs.getBoolean(Prefs.RUNNING, false);
        boolean paused = prefs.getBoolean(Prefs.PAUSED, false);

        if (running) {
            bubble.setText("Ⅱ");
            bubble.setContentDescription("Contrôle flottant DraftWA — pause");
        } else {
            bubble.setText("▶");
            bubble.setContentDescription(paused
                    ? "Contrôle flottant DraftWA — reprendre"
                    : "Contrôle flottant DraftWA — démarrer");
        }

        String label;
        if (paused) {
            label = "En pause";
        } else if (running) {
            long next = prefs.getLong(Prefs.NEXT_ACTION_AT, 0L);
            long remaining = next - System.currentTimeMillis();
            label = next > 0L && remaining > 0L ? "Prochain en " + formatDuration(remaining) : "Traitement…";
        } else {
            label = "DraftWA prêt";
        }
        timer.setText(label);
        timer.setContentDescription("État DraftWA : " + label);
    }

    void destroy() {
        shown = false;
        handler.removeCallbacksAndMessages(null);
        try { prefs.unregisterOnSharedPreferenceChangeListener(listener); } catch (Throwable ignored) {}
        if (windowManager != null) {
            try { if (bubble != null) windowManager.removeView(bubble); } catch (Throwable ignored) {}
            try { if (timer != null) windowManager.removeView(timer); } catch (Throwable ignored) {}
        }
        bubble = null;
        timer = null;
        bubbleParams = null;
    }

    private String formatDuration(long millis) {
        long total = Math.max(0L, (millis + 999L) / 1000L);
        long hours = total / 3600L;
        long minutes = (total % 3600L) / 60L;
        long seconds = total % 60L;
        if (hours > 0L) return String.format(Locale.ROOT, "%d:%02d:%02d", hours, minutes, seconds);
        return String.format(Locale.ROOT, "%02d:%02d", minutes, seconds);
    }

    private GradientDrawable roundRect(int fill, int radiusDp, int stroke, int strokeDp) {
        GradientDrawable d = new GradientDrawable();
        d.setColor(fill);
        d.setCornerRadius(dp(radiusDp));
        d.setStroke(dp(strokeDp), stroke);
        return d;
    }

    private int clampX(int x) {
        int max = Math.max(0, context.getResources().getDisplayMetrics().widthPixels - dp(50));
        return Math.max(0, Math.min(max, x));
    }

    private int clampY(int y) {
        int max = Math.max(dp(48), context.getResources().getDisplayMetrics().heightPixels - dp(96));
        return Math.max(dp(24), Math.min(max, y));
    }

    private int dp(int value) {
        return Math.round(value * context.getResources().getDisplayMetrics().density);
    }

    private final class BubbleTouch implements View.OnTouchListener {
        private float downRawX, downRawY;
        private int downX, downY;
        private boolean moved;

        @Override public boolean onTouch(View v, MotionEvent event) {
            if (bubbleParams == null || windowManager == null) return false;
            switch (event.getActionMasked()) {
                case MotionEvent.ACTION_DOWN:
                    downRawX = event.getRawX();
                    downRawY = event.getRawY();
                    downX = bubbleParams.x;
                    downY = bubbleParams.y;
                    moved = false;
                    bubble.setAlpha(1f);
                    return true;
                case MotionEvent.ACTION_MOVE:
                    float dx = event.getRawX() - downRawX;
                    float dy = event.getRawY() - downRawY;
                    if (!moved && Math.hypot(dx, dy) > dp(6)) moved = true;
                    if (moved) {
                        bubbleParams.x = clampX(downX + Math.round(dx));
                        bubbleParams.y = clampY(downY + Math.round(dy));
                        try { windowManager.updateViewLayout(bubble, bubbleParams); } catch (Throwable ignored) {}
                    }
                    return true;
                case MotionEvent.ACTION_UP:
                case MotionEvent.ACTION_CANCEL:
                    bubble.setAlpha(0.94f);
                    if (moved) {
                        prefs.edit().putInt(Prefs.OVERLAY_X, bubbleParams.x).putInt(Prefs.OVERLAY_Y, bubbleParams.y).apply();
                    } else if (event.getActionMasked() == MotionEvent.ACTION_UP && toggleAction != null) {
                        toggleAction.run();
                    }
                    return true;
                default:
                    return false;
            }
        }
    }
}
'''
          (root/'app/src/main/java/com/draftwa/mobile/DraftOverlayController.java').write_text(overlay, encoding='utf-8')

          p = root/'app/src/main/java/com/draftwa/mobile/Prefs.java'
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              '    static final String PAUSED = "paused";\n',
              '    static final String PAUSED = "paused";\n    static final String PAUSE_REMAINING_MS = "pause_remaining_ms";\n    static final String OVERLAY_X = "overlay_x";\n    static final String OVERLAY_Y = "overlay_y";\n',
              'prefs keys')
          s = replace_once(s,
              '        if (!sp.contains(PAUSED)) e.putBoolean(PAUSED, false);\n',
              '        if (!sp.contains(PAUSED)) e.putBoolean(PAUSED, false);\n        if (!sp.contains(PAUSE_REMAINING_MS)) e.putLong(PAUSE_REMAINING_MS, 0L);\n',
              'prefs defaults')
          s = replace_once(s,
              '                .putLong(NEXT_ACTION_AT, 0L)\n',
              '                .putLong(NEXT_ACTION_AT, 0L)\n                .putLong(PAUSE_REMAINING_MS, 0L)\n',
              'reset pause remainder')
          methods = '''    static long pauseAutomation(Context c) {\n        SharedPreferences sp = p(c);\n        long now = System.currentTimeMillis();\n        long next = sp.getLong(NEXT_ACTION_AT, 0L);\n        long remaining = next > now ? next - now : 0L;\n        sp.edit()\n                .putBoolean(RUNNING, false)\n                .putBoolean(PAUSED, true)\n                .putLong(PAUSE_REMAINING_MS, remaining)\n                .apply();\n        return remaining;\n    }\n\n    static long resumeAutomation(Context c) {\n        SharedPreferences sp = p(c);\n        long remaining = Math.max(0L, sp.getLong(PAUSE_REMAINING_MS, 0L));\n        long next = remaining > 0L ? System.currentTimeMillis() + remaining : 0L;\n        sp.edit()\n                .putBoolean(RUNNING, true)\n                .putBoolean(PAUSED, false)\n                .putLong(PAUSE_REMAINING_MS, 0L)\n                .putLong(NEXT_ACTION_AT, next)\n                .apply();\n        return remaining;\n    }\n\n'''
          s = replace_once(s, '    static Set<String> skipped(Context c) {\n', methods + '    static Set<String> skipped(Context c) {\n', 'prefs pause helpers')
          p.write_text(s, encoding='utf-8')

          p = root/'app/src/main/java/com/draftwa/mobile/DraftAccessibilityService.java'
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              '    private final Random random = new Random();\n',
              '    private final Random random = new Random();\n    private DraftOverlayController overlayController;\n',
              'service overlay field')
          s = replace_once(s,
              '        DiagnosticLog.event(this, "ACCESSIBILITY_CONNECTED", "");\n        schedule(300);\n',
              '        DiagnosticLog.event(this, "ACCESSIBILITY_CONNECTED", "");\n        overlayController = new DraftOverlayController(this, this::toggleOverlayEngine);\n        overlayController.show();\n        schedule(300);\n',
              'service connected overlay')
          insert = '''\n    @Override\n    public void onDestroy() {\n        if (overlayController != null) overlayController.destroy();\n        handler.removeCallbacksAndMessages(null);\n        ticking = false;\n        super.onDestroy();\n    }\n\n    private void toggleOverlayEngine() {\n        SharedPreferences sp = Prefs.p(this);\n        if (sp.getBoolean(Prefs.RUNNING, false)) {\n            long remaining = Prefs.pauseAutomation(this);\n            handler.removeCallbacks(ticker);\n            ticking = false;\n            Prefs.p(this).edit().putString(Prefs.STATUS, "En pause").apply();\n            DiagnosticLog.event(this, "OVERLAY_PAUSE", "remainingMs=" + remaining);\n        } else {\n            boolean paused = sp.getBoolean(Prefs.PAUSED, false);\n            if (paused) {\n                long remaining = Prefs.resumeAutomation(this);\n                Prefs.p(this).edit().putString(Prefs.STATUS, "Reprise…").apply();\n                DiagnosticLog.event(this, "OVERLAY_RESUME", "remainingMs=" + remaining);\n            } else {\n                Prefs.resetRunState(this);\n                Prefs.p(this).edit()\n                        .putBoolean(Prefs.RUNNING, true)\n                        .putBoolean(Prefs.PAUSED, false)\n                        .putString(Prefs.STATUS, "Démarrage…")\n                        .apply();\n                DiagnosticLog.event(this, "OVERLAY_START", "");\n            }\n            schedule(80);\n        }\n        if (overlayController != null) overlayController.refreshNow();\n    }\n'''
          s = replace_once(s,
              '    @Override\n    public void onInterrupt() {\n        status("Service d’accessibilité interrompu", "ACCESSIBILITY_INTERRUPTED");\n    }\n',
              '    @Override\n    public void onInterrupt() {\n        status("Service d’accessibilité interrompu", "ACCESSIBILITY_INTERRUPTED");\n    }\n' + insert,
              'service lifecycle/toggle')
          p.write_text(s, encoding='utf-8')

          p = root/'app/src/main/java/com/draftwa/mobile/MainActivity.java'
          s = p.read_text(encoding='utf-8')
          old = '''        Prefs.resetRunState(this);\n        Prefs.p(this).edit()\n                .putBoolean(Prefs.RUNNING, true)\n                .putBoolean(Prefs.PAUSED, false)\n                .putString(Prefs.STATUS, diagnostic.isChecked() ? "Diagnostic en cours…" : "Démarrage…")\n                .apply();\n        DiagnosticLog.event(this, "RUN_START", "diagnostic=" + diagnostic.isChecked());\n'''
          new = '''        SharedPreferences runPrefs = Prefs.p(this);\n        boolean resuming = runPrefs.getBoolean(Prefs.PAUSED, false);\n        if (resuming) {\n            long remaining = Prefs.resumeAutomation(this);\n            runPrefs.edit().putString(Prefs.STATUS, "Reprise…").apply();\n            DiagnosticLog.event(this, "RUN_RESUME", "remainingMs=" + remaining);\n        } else {\n            Prefs.resetRunState(this);\n            runPrefs.edit()\n                    .putBoolean(Prefs.RUNNING, true)\n                    .putBoolean(Prefs.PAUSED, false)\n                    .putString(Prefs.STATUS, diagnostic.isChecked() ? "Diagnostic en cours…" : "Démarrage…")\n                    .apply();\n            DiagnosticLog.event(this, "RUN_START", "diagnostic=" + diagnostic.isChecked());\n        }\n'''
          s = replace_once(s, old, new, 'main start/resume')
          old = '''        Prefs.p(this).edit()\n                .putBoolean(Prefs.RUNNING, false)\n                .putBoolean(Prefs.PAUSED, true)\n                .putString(Prefs.STATUS, "En pause")\n                .apply();\n        DiagnosticLog.event(this, "RUN_PAUSE", "user");\n'''
          new = '''        long remaining = Prefs.pauseAutomation(this);\n        Prefs.p(this).edit().putString(Prefs.STATUS, "En pause").apply();\n        DiagnosticLog.event(this, "RUN_PAUSE", "remainingMs=" + remaining);\n'''
          s = replace_once(s, old, new, 'main pause')
          p.write_text(s, encoding='utf-8')

          p = root/'app/build.gradle'
          s = p.read_text(encoding='utf-8')
          s = s.replace('// DraftWA 0.8.4 safe-tab-scroll release marker', '// DraftWA 0.8.5 minimal overlay release marker', 1)
          s = s.replace("orElse('804').get().toInteger()", "orElse('805').get().toInteger()", 1)
          s = s.replace("orElse('0.8.4').get()", "orElse('0.8.5').get()", 1)
          p.write_text(s, encoding='utf-8')

          p = root/'tools/static_review.py'
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              "opportunity=(ROOT/'app/src/main/java/com/draftwa/mobile/OpportunityActivity.java').read_text()\n",
              "opportunity=(ROOT/'app/src/main/java/com/draftwa/mobile/OpportunityActivity.java').read_text()\noverlay=(ROOT/'app/src/main/java/com/draftwa/mobile/DraftOverlayController.java').read_text()\n",
              'static overlay source')
          s = replace_once(s,
              "check('Pause resume persistence', 'PAUSED' in prefs and 'BATCH_TARGET' in prefs)\n",
              "check('Pause resume persistence', 'PAUSED' in prefs and 'BATCH_TARGET' in prefs)\ncheck('Pause freezes remaining countdown', 'PAUSE_REMAINING_MS' in prefs and 'pauseAutomation' in prefs and 'resumeAutomation' in prefs)\ncheck('Accessibility overlay used without draw-over-apps permission', 'TYPE_ACCESSIBILITY_OVERLAY' in overlay and 'SYSTEM_ALERT_WINDOW' not in manifest)\ncheck('Minimal white floating control exists', 'Color.WHITE' in overlay and 'Contrôle flottant DraftWA' in overlay and 'dp(46)' in overlay)\ncheck('Persistent bottom countdown exists', 'Prochain en ' in overlay and 'Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL' in overlay)\ncheck('Overlay is draggable and position persists', 'OVERLAY_X' in prefs and 'OVERLAY_Y' in prefs and 'BubbleTouch' in overlay)\ncheck('Overlay pause/resume is wired into accessibility service', 'toggleOverlayEngine' in service and 'OVERLAY_PAUSE' in service and 'OVERLAY_RESUME' in service)\n",
              'static overlay checks')
          s = s.replace("check('Release version is 0.8.4', \"orElse('804')\" in build and \"orElse('0.8.4')\" in build)",
                        "check('Release version is 0.8.5', \"orElse('805')\" in build and \"orElse('0.8.5')\" in build)", 1)
          p.write_text(s, encoding='utf-8')

          p = root/'tools/ci_android_journey.sh'
          s = p.read_text(encoding='utf-8')
          anchor = '''adb shell uiautomator dump /sdcard/after-start.xml >/dev/null || true\nadb pull /sdcard/after-start.xml artifacts/after-start.xml >/dev/null || true\nsleep 28\n'''
          block = '''adb shell uiautomator dump /sdcard/after-start.xml >/dev/null || true\nadb pull /sdcard/after-start.xml artifacts/after-start.xml >/dev/null || true\n\n# 0.8.5 regression: the control must remain visible above FakeWA, pause the\n# engine without leaving the app, expose the paused state, and resume again.\npython3 - <<'PY'\nimport re, subprocess, xml.etree.ElementTree as ET\nroot=ET.parse('artifacts/after-start.xml').getroot()\nfor n in root.iter('node'):\n    if n.attrib.get('content-desc') == 'Contrôle flottant DraftWA — pause':\n        m=re.match(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]', n.attrib.get('bounds',''))\n        if not m: continue\n        x1,y1,x2,y2=map(int,m.groups())\n        subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])\n        raise SystemExit(0)\nraise SystemExit('floating pause control not found')\nPY\nsleep 1\nadb shell run-as com.draftwa.mobile cat shared_prefs/draftwa_mobile_v070.xml > artifacts/overlay-paused-prefs.xml\ngrep -q 'name="running" value="false"' artifacts/overlay-paused-prefs.xml\ngrep -q 'name="paused" value="true"' artifacts/overlay-paused-prefs.xml\nadb shell uiautomator dump /sdcard/overlay-paused.xml >/dev/null\nadb pull /sdcard/overlay-paused.xml artifacts/overlay-paused.xml >/dev/null\ngrep -q 'Contrôle flottant DraftWA — reprendre' artifacts/overlay-paused.xml\ngrep -q 'État DraftWA : En pause' artifacts/overlay-paused.xml\npython3 - <<'PY'\nimport re, subprocess, xml.etree.ElementTree as ET\nroot=ET.parse('artifacts/overlay-paused.xml').getroot()\nfor n in root.iter('node'):\n    if n.attrib.get('content-desc') == 'Contrôle flottant DraftWA — reprendre':\n        m=re.match(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]', n.attrib.get('bounds',''))\n        if not m: continue\n        x1,y1,x2,y2=map(int,m.groups())\n        subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])\n        raise SystemExit(0)\nraise SystemExit('floating resume control not found')\nPY\nsleep 1\nadb shell run-as com.draftwa.mobile cat shared_prefs/draftwa_mobile_v070.xml > artifacts/overlay-resumed-prefs.xml\ngrep -q 'name="running" value="true"' artifacts/overlay-resumed-prefs.xml\ngrep -q 'name="paused" value="false"' artifacts/overlay-resumed-prefs.xml\nsleep 30\n'''
          s = replace_once(s, anchor, block, 'ci overlay journey')
          s = s.replace("NO_DRAFTWA_ANR=PASS\\n' > artifacts/result.txt", "NO_DRAFTWA_ANR=PASS\\nOVERLAY_CONTROL=PASS\\n' > artifacts/result.txt", 1)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tools
          git commit -m "DraftWA 0.8.5: add minimal persistent overlay control"
          git push origin HEAD:draftwa-0.8.5-overlay
