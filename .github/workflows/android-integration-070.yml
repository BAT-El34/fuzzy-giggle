name: DraftWA 0.7.0 Dedicated Android Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - draftwa-0.7.0
    paths:
      - 'app/**'
      - 'fakewa/**'
      - 'tools/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-integration-070.yml'

permissions:
  contents: read
  statuses: write

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Static and model validation
        run: |
          python3 tools/static_review.py
          python3 tools/engine_model_test.py
          mkdir -p build/rules
          javac -d build/rules app/src/main/java/com/draftwa/mobile/MessageRules.java tools/RuleSimulation.java
          java -cp build/rules com.draftwa.mobile.RuleSimulation

  android-integration:
    needs: rules
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Publish run link
        env:
          GH_TOKEN: ${{ github.token }}
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --retry 3 --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${RUN_URL}\",\"description\":\"DraftWA 0.7.0 API ${API_LEVEL} diagnostic running\",\"context\":\"draftwa/0.7.0-api-${API_LEVEL}\"}"
      - name: Build DraftWA and fake WhatsApp Business
        run: gradle --no-daemon :app:assembleDebug :fakewa:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator diagnostic journey
        id: journey
        uses: ReactiveCircus/android-emulator-runner@v2.34.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: |
            set -euxo pipefail
            mkdir -p artifacts
            DRAFTWA=app/build/outputs/apk/debug/app-debug.apk
            FAKEWA=fakewa/build/outputs/apk/debug/fakewa-debug.apk
            adb install -r "$FAKEWA"
            adb install -r "$DRAFTWA"
            adb shell settings put secure enabled_accessibility_services com.draftwa.mobile/com.draftwa.mobile.DraftAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            adb shell am force-stop com.draftwa.mobile
            adb logcat -c
            adb shell monkey -p com.draftwa.mobile -c android.intent.category.LAUNCHER 1
            sleep 3
            adb exec-out screencap -p > artifacts/draftwa-home.png || true
            adb shell uiautomator dump /sdcard/draftwa-home.xml >/dev/null
            adb pull /sdcard/draftwa-home.xml artifacts/draftwa-home.xml >/dev/null
            FOUND=0
            for ATTEMPT in 1 2 3 4 5 6; do
              adb shell uiautomator dump /sdcard/draftwa.xml >/dev/null
              adb pull /sdcard/draftwa.xml artifacts/draftwa.xml >/dev/null
              if python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            root=ET.parse('artifacts/draftwa.xml').getroot()
            labels={'Tester en diagnostic','Reprendre','Démarrer le moteur','Démarrer'}
            for n in root.iter('node'):
                if n.attrib.get('text') in labels and n.attrib.get('enabled','true') == 'true':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib['bounds'])
                    if not m:
                        continue
                    x=(int(m.group(1))+int(m.group(3)))//2
                    y=(int(m.group(2))+int(m.group(4)))//2
                    subprocess.check_call(['adb','shell','input','tap',str(x),str(y)])
                    raise SystemExit(0)
            raise SystemExit(9)
            PY
              then
                FOUND=1
                break
              fi
              adb shell input swipe 540 1750 540 650 300
              sleep 1
            done
            test "$FOUND" = "1"
            sleep 24
            adb exec-out screencap -p > artifacts/final.png || true
            adb shell uiautomator dump /sdcard/final.xml >/dev/null || true
            adb pull /sdcard/final.xml artifacts/final.xml >/dev/null || true
            adb logcat -d -v threadtime > artifacts/logcat.txt
            adb shell run-as com.whatsapp.w4b cat shared_prefs/ci.xml > artifacts/fakewa-ci.xml 2>/dev/null || true
            cat artifacts/fakewa-ci.xml || true
            grep -q 'name="opened" value="true"' artifacts/fakewa-ci.xml
            grep -q 'name="transformed_seen" value="true"' artifacts/fakewa-ci.xml
            grep -q 'name="restored" value="true"' artifacts/fakewa-ci.xml
            ! grep -q 'name="sent" value="true"' artifacts/fakewa-ci.xml
            grep -q 'DRAFT_SCAN_PAGE' artifacts/logcat.txt
            grep -q 'DRAFT_INDICATORS' artifacts/logcat.txt
            grep -q 'DRAFT_OPENED' artifacts/logcat.txt
            grep -q 'EDITOR_FOUND' artifacts/logcat.txt
            grep -q 'CONFIRMATION_PASS' artifacts/logcat.txt
            grep -q 'TRANSFORM_PASS' artifacts/logcat.txt
            grep -q 'RESTORED_OK' artifacts/logcat.txt
            grep -q 'SEND_SKIPPED_DIAGNOSTIC' artifacts/logcat.txt
            PID=$(adb shell pidof com.draftwa.mobile | tr -d '\r')
            test -n "$PID"
            if grep -A30 'FATAL EXCEPTION' artifacts/logcat.txt | grep -q 'com.draftwa.mobile'; then
              echo 'DraftWA crashed'
              exit 1
            fi
            printf 'API=%s\nDIAGNOSTIC_FLOW=PASS\nNO_SEND=PASS\nRESTORE=PASS\nNO_FATAL=PASS\n' '${{ matrix.api-level }}' > artifacts/result.txt
      - name: Publish matrix result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          API_LEVEL: ${{ matrix.api-level }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --retry 3 --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"target_url\":\"${RUN_URL}\",\"description\":\"DraftWA 0.7.0 API ${API_LEVEL}: ${JOB_STATUS}\",\"context\":\"draftwa/0.7.0-api-${API_LEVEL}\"}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draftwa-api-${{ matrix.api-level }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            fakewa/build/outputs/apk/debug/fakewa-debug.apk
            artifacts/**
          if-no-files-found: warn
          retention-days: 7

  release-candidate:
    needs: android-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Re-run non-Android validation
        run: |
          python3 tools/static_review.py
          python3 tools/engine_model_test.py
          mkdir -p build/rules
          javac -d build/rules app/src/main/java/com/draftwa/mobile/MessageRules.java tools/RuleSimulation.java
          java -cp build/rules com.draftwa.mobile.RuleSimulation
      - name: Build exact unsigned release candidate
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: DraftWA-unsigned-release-candidate
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
